<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>성적표 · TOEIC Mock Test</title>
  <link rel="stylesheet" href="/static/css/tailwind.css?v={{ ver }}" />
  <link rel="stylesheet" href="/static/css/dark.css?v={{ ver }}" />
</head>
<body class="bg-slate-100 text-slate-800">

  <!-- 헤더 -->
  <header class="bg-white border-b border-slate-200 shadow-sm">
    <div class="max-w-screen-xl mx-auto px-4 h-16 flex items-center gap-3">
      <span class="text-xl">📊</span>
      <div>
        <h1 id="reportTitle" class="font-bold text-slate-900 leading-tight">성적표</h1>
        <p class="text-xs text-slate-400 leading-tight">TOEIC Full Mock Test · Result Report</p>
      </div>
      <div class="ml-auto flex items-center gap-2">
        <a id="retryLink" href="/"
           class="text-sm font-medium border border-slate-300 rounded-lg px-3 py-1.5 hover:bg-slate-50">다시 응시</a>
      </div>
    </div>
  </header>

  <main class="max-w-screen-xl mx-auto px-4 py-8 space-y-8">

    <!-- 점수 요약 -->
    <section id="scoreSummary" class="grid grid-cols-1 md:grid-cols-3 gap-4"></section>

    <!-- 점수 추이 -->
    <section id="historySection" class="bg-white rounded-xl border border-slate-200 shadow-sm p-6">
      <div class="flex items-center justify-between mb-4 flex-wrap gap-2">
        <div>
          <h2 class="font-bold text-slate-900">점수 추이</h2>
          <p id="historyLead" class="text-sm text-slate-500"></p>
        </div>
        <button id="historyClearBtn"
                class="text-xs font-medium text-slate-400 hover:text-red-500 underline">기록 초기화</button>
      </div>
      <div id="historyChart" class="w-full overflow-x-auto"></div>
      <div id="historyTable" class="mt-4"></div>
    </section>

    <!-- 파트별 통계 -->
    <section class="bg-white rounded-xl border border-slate-200 shadow-sm p-6">
      <h2 class="font-bold text-slate-900 mb-4">파트별 정답률</h2>
      <div id="partStats" class="space-y-3"></div>
    </section>

    <!-- 유형별 약점 진단 -->
    <section id="weaknessSection" class="bg-white rounded-xl border border-slate-200 shadow-sm p-6">
      <h2 class="font-bold text-slate-900 mb-1">유형별 약점 진단</h2>
      <p id="weaknessLead" class="text-sm text-slate-500 mb-4"></p>
      <div id="weaknessStats" class="space-y-3"></div>
    </section>

    <!-- 회차 단어장 -->
    <section id="vocabSection" class="bg-white rounded-xl border border-slate-200 shadow-sm p-6">
      <div class="flex items-center justify-between mb-4 flex-wrap gap-2">
        <div>
          <h2 class="font-bold text-slate-900">회차 단어장</h2>
          <p id="vocabCount" class="text-sm text-slate-500"></p>
        </div>
        <div class="flex items-center gap-1 text-sm">
          <button data-vfilter="all" class="vocab-btn px-3 py-1.5 rounded-lg font-medium">전체</button>
          <button data-vfilter="wrong" class="vocab-btn px-3 py-1.5 rounded-lg font-medium">오답 문항만</button>
          <button id="vocabCsvBtn"
                  class="ml-2 px-3 py-1.5 rounded-lg font-medium border border-slate-300 hover:bg-slate-50">
            CSV 내보내기
          </button>
        </div>
      </div>
      <div id="vocabList" class="grid grid-cols-1 sm:grid-cols-2 gap-2"></div>
    </section>

    <!-- 오답 노트 / 문제별 리뷰 -->
    <section class="bg-white rounded-xl border border-slate-200 shadow-sm p-6">
      <div class="flex items-center justify-between mb-4 flex-wrap gap-2">
        <h2 class="font-bold text-slate-900">문제별 해설 &amp; 오답 노트</h2>
        <div class="flex gap-1 text-sm">
          <button data-filter="all" class="filter-btn px-3 py-1.5 rounded-lg font-medium">전체</button>
          <button data-filter="wrong" class="filter-btn px-3 py-1.5 rounded-lg font-medium">오답만</button>
          <button data-filter="unanswered" class="filter-btn px-3 py-1.5 rounded-lg font-medium">미표기</button>
        </div>
      </div>
      <div id="reviewList" class="space-y-4"></div>
    </section>
  </main>

  <div id="noData" class="hidden max-w-screen-xl mx-auto px-4 py-20 text-center text-slate-400">
    표시할 결과가 없습니다. <a href="/" class="text-emerald-600 underline">모의고사 다시 응시하기</a>
  </div>

  <script src="/static/js/result.js?v={{ ver }}"></script>
</body>
</html>
